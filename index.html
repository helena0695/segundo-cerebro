function financeView(){let months=finVisibleMonths(),slots=finMonthSlots(),totals=months.map(finTotals),exp=totals.reduce((a,t)=>a+t.expense,0),inc=totals.reduce((a,t)=>a+t.income,0),paid=totals.reduce((a,t)=>a+t.paid,0),received=totals.reduce((a,t)=>a+t.received,0);let acc=0;return `<div class="row fin-top"><h2>Financeiro</h2><div class="actions"><button data-fin-new-month>+ Novo mês</button></div></div><div class="fin-period fin-month-picker"><button data-fin-prev aria-label="Mês anterior">‹</button><select id="fin-year" aria-label="Selecionar mês">${finPeriods().map(k=>{let [y,m]=k.split('-').map(Number);let label=new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});return `<option value="${k}" ${finPeriod===k?'selected':''}>${label}</option>`}).join('')}</select><button data-fin-next aria-label="Próximo mês">›</button></div><div class="fin-kpis"><div><small>Entradas previstas</small><strong>${money(inc)}</strong></div><div><small>Despesas previstas</small><strong>${money(exp)}</strong></div><div><small>Saldo previsto</small><strong>${money(inc-exp)}</strong></div><div><small>Saldo realizado</small><strong>${money(received-paid)}</strong></div></div><div class="fin-grid">${slots.map(({key,p})=>{if(!p){let [y,m]=key.split('-').map(Number),label=new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});return `<section class="card fin-month fin-placeholder"><div class="fin-empty-month"><strong>${esc(label)}</strong><span class="muted">Nenhum lançamento neste mês.</span><button class="primary" data-fin-create="${key}">+ Começar este mês</button></div></section>`}let t=finTotals(p),items=planItems(p);acc+=t.income-t.expense;return `<section class="card fin-month"><details open><summary class="fin-month-head"><span><strong>${esc(finMonthLabel(p))}</strong><small>${money(t.income)} entradas · ${money(t.expense)} despesas</small></span><span class="plan-chevron">⌄</span></summary><div class="fin-body"><div class="fin-subtotals">< function bindFinance(){let year=document.getElementById("fin-year");if(year)year.onchange=()=>{finPeriod=year.value;render()};document.querySelectorAll('[data-fin-prev],[data-fin-next]').forEach(b=>b.onclick=()=>{finShiftMonth(b.hasAttribute('data-fin-next')?1:-1)});document.querySelectorAll('[data-fin-create]').forEach(b=>b.onclick=()=>finCreateMonth(b.dataset.finCreate));document.querySelectorAll('[data-fin-delete-month]').forEach(b=>b.onclick=()=>{let p=shared.find(x=>x.id===b.dataset.finDeleteMonth);if(!p)return;if(!confirm('Excluir '+finMonthLabel(p)+' e todos os lançamentos deste mês?'))return;planAction(async()=>{let {error}=await client.from('shared_records').delete().eq('id',p.id);if(error)throw error;await load();toast('Mês excluído')})});document.querySelectorAll("[data-fin-new-month]").forEach(b=>b.onclick=()=>finOpen("month"));document.querySelectorAll("[data-fin-add]").forEach(b=>b.onclick=()=>finOpen("item",b.dataset.finAdd,null,b.dataset.type));document.querySelectorAll("[data-fin-edit]").forEach(b=>b.onclick=()=>finOpen("item",b.dataset.finEdit,Number(b.dataset.index)));document.querySelectorAll("[data-fin-check]").forEach(b=>b.onchange=()=>planAction(()=>finUpdate(b.dataset.finCheck,m=>{m.items=m.items.map((i,n)=>n===Number(b.dataset.index)?{...i,done:b.checked}:i)})));document.querySelectorAll("[data-fin-delete]").forEach(b=>b.onclick=()=>{if(!confirm("Excluir este lançamento?"))return;planAction(()=>finUpdate(b.dataset.finDelete,m=>{m.items=m.items.filter((_,n)=>n!==Number(b.dataset.index))}))});let close=document.getElementById("fin-close"),cancel=document.getElementById("fin-cancel"),form=document.getElementById("fin-form");if(close)close.onclick=finClose;if(cancel)cancel.onclick=finClose;if(form)form.onsubmit=async e=>{e.preventDefault();let state=finEdit;if(!state)return;let btn=document.getElementById("fin-save");btn.disabled=true;let fd=Object.fromEntries(new FormData(form).entries());try{if(state.mode==="item"){if(!fd.title.trim())throw Er else if(tab==="plans")content=`<div class="row"><h2>Planejamentos</h2><button data-add="shared:agenda_item">+ Novo planejamento</button></div><div class="plan-grid">${allPlans().map(planCard).join("")}</div>`;

else if(tab==="meeting")content=`<div class="row"><h2>Reuniões</h2><button data-new-meeting>+ Nova reunião</button></div><section class="card" style="margin-bottom:14px"><h3>Próxima reunião</h3>${pending.slice(0,12).map(i=>`<div class="plan-item"><div class="plan-info"><b>${esc(i.title)}</b><small>${esc(i.plan)}</small></div></div>`).join("")||'<p class="muted">Sem providências em aberto. Cadastre itens em Planejamentos.</p>'}<button data-new-meeting class="primary" style="margin-top:12px">Criar reunião com essas pautas</button></section>${meetings.map(meetingCard).join("")||'<div class="empty">Nenhuma reunião cadastrada.</div>'}`;
else content=card(sharedKinds[tab]||"Registros",rows(sharedRows(tab),true),buttonAdd("shared:"+tab));
return `<div class="plan-toolbar"><span></span><button id="refresh-shared">↻ Atualizar dados</button></div>${info}${`<div class="tabs">${ts.map(([k,n])=>`<button data-tab="${k}" class="${tab===k?"on":""}">${n} (${k==="plans"?allPlans().length:k==="finance"?financePlans().length:k==="pending"?pending.length:sharedRows(k).length})</button>`).join("")}</div>`}${content}`}
function parseMoney(s){let x=String(s||"").replace(/[^\d,.]/g,"");if(x.includes(","))x=x.replace(/\./g,"").replace(",",".");return Number(x)||0}
async function savePlanItems(id,items){let p=shared.find(x=>x.id===id);if(!p)return;let {error}=await client.from("shared_records").update({metadata:{...(p.metadata||{}),items}}).eq("id",id);if(error)throw error;await load()}
async function planAction(fn){try{await fn()}catch(e){toast("Não foi possível salvar: "+errorMsg(e))}}
async function newMeeting(){let pend=pendingItems();let last=sharedRows("meeting").sort((a,b)=>(b.event_date||"").localeCompare(a.event_date||""))[0];let topics=[...new Set(pend.map(i=>i.plan))];let text=`PAUTAS SUGERIDAS PARA A PRÓXIMA REUNIÃO\n${topics.map(t=>"\n"+t+"\n"+pend.filter(i=>i.plan===t).map(i=>"- PENDENTE: "+i.title).join("\n")).join("\n")}\n\nASSUNTOS DA ÚLTIMA REUNIÃO\n${last?last.title+"\n"+summaryText(last.description):"Sem reunião anterior."}\n\nNOVAS DECISÕES E COMBINADOS\n`;openForm("shared:meeting");document.querySelector('#fields [name="title"]').value="Nova reunião de planejamento";document.querySelector('#fields [name="description"]').value=text;toast("Pautas sugeridas preenchidas. Revise antes de salvar.")}
function bindPlans(){document.querySelectorAll("[data-plan-check]").forEach(b=>b.onchange=()=>planAction(async()=>{let p=shared.find(x=>x.id===b.dataset.planCheck),items=planItems(p).map(x=>({...x}));items[+b.dataset.index].done=b.checked;await savePlanItems(p.id,items)}));document.querySelectorAll("[data-plan-add]").forEach(f=>f.onsubmit=e=>{e.preventDefault();planAction(async()=>{let p=shared.find(x=>x.id===f.dataset.planAdd),fd=new FormData(f),items=planItems(p).map(x=>({...x}));items.push({title:String(fd.get("title")).trim(),budget:parseMoney(fd.get("budget")),spent:0,done:false});await savePlanItems(p.id,items);toast("Providência adicionada")})});document.querySelectorAll("[data-plan-edit]").forEach(b=>b.onclick=()=>{let p=shared.find(x=>x.id===b.dataset.planEdit),items=planItems(p).map(x=>({...x})),i=items[+b.dataset.index];let title=prompt("Providência:",i.title);if(title===null||!title.trim())return;let budget=prompt("Valor previsto (R$):",String(i.budget||0));if(budget===null)return;let spent=prompt("Valor já gasto (R$):",String(i.spent||0));if(spent===null)return;let owner=prompt("Responsável (opcional):",i.owner||"");if(owner===null)return;i.title=title.trim();i.budget=parseMoney(budget);i.spent=parseMoney(spent);i.owner=owner.trim();planAction(()=>savePlanItems(p.id,items))});document.querySelectorAll("[data-open-plan]").forEach(b=>b.onclick=()=>{page="couple";tab="plans";render()});document.querySelectorAll("[data-new-meeting]").forEach(b=>b.onclick=newMeeting)}

function bind(){let refresh=$("#refresh-shared");if(refresh)refresh.onclick=async()=>{refresh.disabled=true;refresh.textContent="Atualizando…";await load();};document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>openForm(b.dataset.add));document.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>{page=b.dataset.goto;render()});document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{page="couple";tab=b.dataset.tab;render()});document.querySelectorAll("[data-add-item]").forEach(b=>b.onclick=()=>openForm("shopping_item",null,b.dataset.addItem));document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{let k=b.dataset.edit,s=k.startsWith("shared:");openForm(k,(s?shared:records).find(x=>x.id===b.dataset.id))});document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>remove(b.dataset.delete,b.dataset.id));document.querySelectorAll("[data-toggle]").forEach(b=>b.onchange=()=>toggle(b.dataset.toggle,b.dataset.id,b.checked));let ask=$("#ask-form");if(ask)ask.onsubmit=e=>{e.preventDefault();runCommand($("#ask-input").value);$("#ask-input").value=""};let mic=$("#mic");if(mic)mic.onclick=()=>listen();bindPlans();bindFinance()}
const field=(name,label,type="text",value="",opts)=>`<div class="form-field"><label>${label}</label>${type==="textarea"?`<textarea name="${name}">${esc(value)}</textarea>`:type==="select"?`<select name="${name}">${opts.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(value)?"selected":""}>${esc(t)}</option>`).join("")}</select>`:`<input type="${type}" name="${name}" value="${esc(value)}" ${name==="title"?"required maxlength=160":""}>`}</div>`;
function openForm(k,r=null,parentId=null){editing={k,id:r?.id||null,parentId};let s=k.startsWith("shared:"),kind=s?k.split(":")[1]:k;$("#edit-title").textContent=(r?"Editar ":"Adicionar ")+(s?sharedKinds[kind]:privateKinds[kind]);let fields=field("title","Título","text",r?.title||"")+field("description",kind==="meeting"?"Ata / detalhes":"Observações","textarea",r?.description||"");if(!s)fields+=field("area","Ambiente","select",r?.metadata?.area||((area==="geral")?"pessoal":area),[["pessoal","Pessoal"],["profissional","Profissional"]]);if(["task","event","project","meeting","agreement","goal"].includes(kind))fields+=field("date","Data / prazo","date",dOnly(r?.due_at||r?.event_date));if(kind==="task")fields+=field("parent_id","Projeto","select",r?.parent_id||"",[["","Nenhum"],...records.filter(x=>x.kind==="project").map(x=>[x.id,x.title])]);$("#fields").innerHTML=fields;$("#edit-overlay").classList.add("show");$("#fields input")?.focus()}
function closeForm(){$("#edit-overlay").classList.remove("show");editing=null}
$("#close-edit").onclick=closeForm;$("#cancel-edit").onclick=closeForm;$("#edit-overlay").onclick=e=>{if(e.target.id==="edit-overlay")closeForm()};
$("#edit-form").onsubmit=async e=>{e.preventDefault();if(busy||!editing)return;busy=true;$("#save-btn").disabled=true;let {k,id,parentId}=editing,s=k.startsWith("shared:"),kind=s?k.split(":")[1]:k,fd=Object.fromEntries(new FormData(e.target).entries());let payload={kind,title:fd.title.trim(),description:fd.description||""};if(!payload.title){toast("Informe um título");busy=false;$("#save-btn").disabled=false;return}if(s){payload.event_date=fd.date||null;if(!id){payload.space_id=spaceId;payload.author_id=user.id}}else{payload.due_at=fd.date?new Date(fd.date+"T12:00:00").toISOString():null;payload.metadata={area:fd.area||"pessoal"};payload.parent_id=kind==="shopping_item"?parentId:(kind==="task"?(fd.parent_id||null):null);if(!id)payload.owner_id=user.id}try{if(s&&!spaceId)throw Error("Planejamento Nat e Helena ainda não está vinculado a esta conta.");let table=s?"shared_records":"private_records",q=id?client.from(table).update(payload).eq("id",id):client.from(table).insert(payload);let {error}=await q;if(error)throw error;closeForm();await load();toast("Salvo com sucesso!") }catch(err){toast("Não foi possível salvar: "+errorMsg(err))}finally{busy=false;$("#save-btn").disabled=false}};
async function remove(k,id){if(!confirm("Excluir este registro?"))return;let s=k.startsWith("shared:");let {error}=await client.from(s?"shared_records":"private_records").delete().eq("id",id);if(error)toast(errorMsg(error));else{await load();toast("Registro excluído")}}
async function toggle(k,id,completed){let s=k.startsWith("shared:");let {error}=await client.from(s?"shared_records":"private_records").update({completed}).eq("id",id);if(error)toast(errorMsg(error));else await load()}
function addChat(who,text){chat.push({who,text});if(page!=="home")page="home";render()}
function localDate(term){let d=new Date();if(/amanh[ãa]/i.test(term))d.setDate(d.getDate()+1);else if(/hoje/i.test(term)){}else return null;return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
async function runCommand(text){let t=text.trim(),low=t.toLowerCase();addChat("you",t);try{let m;if((m=low.match(/(?:cria|criar|adiciona|adicionar|anota|anotar)\s+(?:uma?\s+)?tarefa\s+(?:para\s+|de\s+)?(.+)/i))){let title=t.slice(t.length-m[1].length).replace(/\s+(amanh[ãa]|hoje)$/i,"").trim(),dt=localDate(t);let {error}=await client.from("private_records").insert({owner_id:user.id,kind:"task",title,description:"",due_at:dt?new Date(dt+"T12:00:00").toISOString():null,metadata:{area:area==="profissional"?"profissional":"pessoal"}});if(error)throw error;await load();addChat("bot","Tarefa criada: "+title+(dt?" — "+fmt(dt):""));return}
if((m=low.match(/(?:cria|criar|faz|fazer)\s+(?:uma?\s+)?lista\s+(?:de\s+)?(?:compras)?\s*(.*)/i))){let title=m[1]?.trim()||"Lista de compras";let {error}=await client.from("private_records").insert({owner_id:user.id,kind:"shopping_list",title,metadata:{area:"pessoal"}});if(error)throw error;await load();addChat("bot","Lista criada: "+title);return}
if((m=low.match(/(?:adiciona|adicionar|coloca|colocar)\s+(.+?)\s+(?:na|à)\s+lista/i))){let l=records.find(x=>x.kind==="shopping_list");if(!l){addChat("bot","Cria primeiro uma lista de compras.");return}let items=m[1].split(/,|\s+e\s+/i).map(x=>x.trim()).filter(Boolean);let {error}=await client.from("private_records").insert(items.map(title=>({owner_id:user.id,kind:"shopping_item",title,parent_id:l.id,metadata:{area:"pessoal"}})));if(error)throw error;await load();addChat("bot",items.length+" produto(s) adicionado(s) à lista "+l.title);return}
if(/(?:quais|mostra|mostrar|tenho|pendentes|fazer).*(?:tarefas|fazer)|(?:tarefas).*(?:hoje|amanh[ãa]|semana)/i.test(low)){let r=records.filter(x=>x.kind==="task"&&!x.completed);if(/hoje/.test(low))r=r.filter(x=>dOnly(x.due_at)===today());if(/amanh[ãa]/.test(low)){let d=new Date();d.setDate(d.getDate()+1);let tomorrow=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;r=r.filter(x=>dOnly(x.due_at)===tomorrow)}addChat("bot",r.length?r.slice(0,12).map(x=>"• "+x.title+(x.due_at?" ("+fmt(x.due_at)+")":"")).join("\n"):"Nenhuma tarefa pendente nesse período.");return}
if(/(?:falta comprar|lista de compras|o que comprar)/i.test(low)){let l=records.find(x=>x.kind==="shopping_list");let r=l?records.filter(x=>x.kind==="shopping_item"&&x.parent_id===l.id&&!x.completed):[];addChat("bot",r.length?r.map(x=>"• "+x.title).join("\n"):"Nenhum item pendente na lista.");return}
if(/(?:compromissos|agenda|marcado)/i.test(low)){let r=records.filter(x=>x.kind==="event").sort((a,b)=>(a.due_at||"").localeCompare(b.due_at||""));addChat("bot",r.length?r.slice(0,10).map(x=>"• "+x.title+(x.due_at?" ("+fmt(x.due_at)+")":"")).join("\n"):"Nenhum compromisso cadastrado.");return}
addChat("bot","Posso criar tarefas e listas de compras, adicionar produtos e consultar tarefas, compras e agenda. Ex.: 'cria tarefa pagar internet amanhã'.")}catch(err){addChat("bot","Erro: "+errorMsg(err))}}
let activeRecognition=null;
function micStatus(message){let el=document.getElementById("voice-status");if(el){el.textContent=message;el.hidden=!message} }
function listen(){
  if(activeRecognition){try{activeRecognition.stop()}catch(e){}activeRecognition=null;micStatus("");return}
  let R=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!R){micStatus("Reconhecimento de voz indisponível neste navegador. Digita o comando abaixo.");return}
  if(!window.isSecureContext){micStatus("Para usar a voz, abre o aplicativo pelo endereço HTTPS do GitHub Pages.");return}
  const rec=new R();activeRecognition=rec;rec.lang="pt-BR";rec.interimResults=false;rec.continuous=false;rec.maxAlternatives=1;
  let heard=false,failed=false;
  micStatus("Ouvindo… fala depois de tocar no microfone. Toca novamente para parar.");
  rec.onresult=e=>{const transcript=e.results?.[0]?.[0]?.transcript?.trim();if(!transcript)return;heard=true;micStatus("");const input=document.getElementById("ask-input");if(input)input.value=transcript;runCommand(transcript)};
  rec.onerror=e=>{failed=true;const messages={"no-speech":"Não ouvi nenhuma fala. Tenta novamente e fala perto do microfone.","not-allowed":"Acesso ao microfone bloqueado. Libera a permissão do navegador para este site.","service-not-allowed":"O serviço de reconhecimento de voz não está disponível neste navegador.","audio-capture":"Microfone não encontrado. Confere se ele está conectado e funcionando.","network":"O reconhecimento de voz está sem conexão. Tenta novamente com internet.","language-not-supported":"Reconhecimento em português indisponível neste navegador.","aborted":""};micStatus(messages[e.error]??"Não foi possível reconhecer a fala. Tenta novamente ou digita o comando.")};
  rec.onend=()=>{if(activeRecognition===rec)activeRecognition=null;if(!heard&&!failed)micStatus("")};
  try{rec.start()}catch(e){activeRecognition=null;micStatus("Não foi possível iniciar o microfone. Tenta novamente.")}
}
