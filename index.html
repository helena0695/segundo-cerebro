<script>
"use strict";
const SUPABASE_URL="https://iqqgdbhfpxarldgnprzy.supabase.co", KEY="sb_publishable_eyDxXQeWvQkz__GV3_fyqA_31cFky9s";
const ALLOWED={"01031555-d852-4093-b8e7-a9dd1fe09b99":"Helena","bb857177-c44c-4337-b6fa-3dcc1f4bf9bb":"Nat"};
const $=s=>document.querySelector(s),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let client,user,records=[],shared=[],spaceId=null,sharedIssue="",page="home",area="geral",tab="meeting",editing=null,chat=[],busy=false;

const paths={home:'<path d="m3 11 9-8 9 8v10h-6v-7H9v7H3z"/>',inbox:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 13h5l2 3h4l2-3h5"/>',check:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="m7 12 3 3 7-7"/>',layers:'<path d="m12 2 9 5-9 5-9-5zM3 12l9 5 9-5M3 17l9 5 9-5"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6M17 2v6M3 10h18"/>',book:'<path d="M12 6C9 4 5 4 2 5v15c3-1 7-1 10 1 3-2 7-2 10-1V5c-3-1-7-1-10 1zM12 6v15"/>',cart:'<circle cx="9" cy="20" r="1"/><circle cx="19" cy="20" r="1"/><path d="M2 3h3l3 13h12l2-9H6"/>',network:'<circle cx="12" cy="4" r="2"/><circle cx="4" cy="19" r="2"/><circle cx="20" cy="19" r="2"/><path d="M11 6 5 17M13 6l6 11M6 19h12"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-8 16-8 16 0"/>',briefcase:'<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M8 7V4h8v3M2 13h20"/>',heart:'<path d="M20 5c-3-3-6-1-8 1-2-2-5-4-8-1-5 5 1 11 8 16 7-5 13-11 8-16z"/>'};

const dOnly=v=>v?v.slice(0,10):"";
const privateRows=k=>records.filter(r=>r.kind===k&&(area==="geral"||r.metadata?.area===area));
const sharedRows=k=>shared.filter(r=>r.kind===k);
function toast(msg){let x=document.createElement("div");x.className="toast";x.textContent=msg;document.body.append(x);setTimeout(()=>x.remove(),4200)}
function errorMsg(e){return e?.message||String(e)}
async function init(){try{if(!window.supabase)throw Error("Não foi possível carregar a biblioteca Supabase. Verifique a internet.");client=window.supabase.createClient(SUPABASE_URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});let {data:{session},error}=await client.auth.getSession();if(error)throw error;$("#loading").classList.add("hide");if(session?.user)await start(session.user);else showLogin()}catch(e){$("#loading").textContent="Erro ao iniciar: "+errorMsg(e)}}
function showLogin(){$("#app").classList.add("hide");$("#login-screen").classList.add("show")}
async function start(u){if(!ALLOWED[u.id]){await client.auth.signOut();showLogin();$("#login-error").textContent="Esta conta não está autorizada.";return}user=u;$("#login-screen").classList.remove("show");$("#app").classList.remove("hide");$("#identity").textContent=ALLOWED[u.id]+" · conta privada";await load()}
async function load(){
 const [a,b,c]=await Promise.all([
  client.from("private_records").select("*").order("created_at",{ascending:false}),
  client.from("shared_spaces").select("id,name").eq("name","Planejamento a Dois"),
  client.from("shared_records").select("*").order("created_at",{ascending:false})
 ]);
 records=a.data||[];
 const spaces=b.data||[], allShared=c.data||[];
 // Nunca escolher cegamente o primeiro espaço: a ata pode ter sido importada em outro espaço autorizado.
 const withAta=spaces.find(s=>allShared.some(r=>r.space_id===s.id && (r.metadata?.source==="ata_25_10_2026" || r.title?.includes("25/10/2026"))));
 const withRecords=spaces.find(s=>allShared.some(r=>r.space_id===s.id));
 spaceId=(withAta||withRecords||spaces[0])?.id||null;
 shared=allShared.filter(r=>r.space_id===spaceId);
 sharedIssue=b.error?"Falha ao consultar os espaços: "+errorMsg(b.error):c.error?"Falha ao consultar registros compartilhados: "+errorMsg(c.error):!spaceId?"Nenhum espaço compartilhado acessível para esta conta.":"";
 if(a.error)toast("Erro nos registros privados: "+errorMsg(a.error));
 render();
}

$("#login-form").onsubmit=async e=>{e.preventDefault();let btn=$("#login-btn");btn.disabled=true;$("#login-error").textContent="";let fd=new FormData(e.target);try{let {data,error}=await client.auth.signInWithPassword({email:fd.get("email").trim(),password:fd.get("password")});if(error)throw error;await start(data.user)}catch(err){$("#login-error").textContent="Não foi possível entrar: "+errorMsg(err)}finally{btn.disabled=false}};
$("#logout").onclick=async()=>{await client.auth.signOut();user=null;records=[];shared=[];showLogin()};
function renderNav(){$("#nav").innerHTML=menu.map(([id,name,ic],i)=>`${i===8?'<div class="nav-label">Áreas</div>':""}<button data-page="${id}" class="${page===id?"on":""}">${svg(ic)}${name}</button>`).join("");$("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{page=b.dataset.page;if(page==="personal")area="pessoal";if(page==="professional")area="profissional";render()})}
function render(){renderNav();$("#page-title").textContent=menu.find(x=>x[0]===page)?.[1]||"Início";$("#page-sub").textContent="Olá, "+ALLOWED[user.id]+"!";$("#areas").classList.toggle("hide",page==="couple");$("#areas").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.area===area));$("#content").innerHTML=page==="home"?home():page==="couple"?couple():page==="map"?mapView():page==="personal"||page==="professional"?areaView():privateKinds[page]?listing(page):home();bind()}
$("#areas").querySelectorAll("button").forEach(b=>b.onclick=()=>{area=b.dataset.area;render()});
$("#add-main").onclick=()=>openForm(page==="couple"?"shared:"+tab:privateKinds[page]?page:"task");
function card(title,body,action){return `<section class="card"><div class="row"><h3>${title}</h3>${action||""}</div>${body}</section>`}
function buttonAdd(k){return `<button data-add="${k}">+ Adicionar</button>`}
function row(r,isShared=false){let k=isShared?"shared:"+r.kind:r.kind;let check=["task","shopping_item","agreement","agenda_item"].includes(r.kind)?`<input type="checkbox" data-toggle="${k}" data-id="${r.id}" ${r.completed?"checked":""} aria-label="Concluir">`:"";return `<div class="item">${check}<div class="item-main"><b style="${r.completed?"text-decoration:line-through;opacity:.6":""}">${esc(r.title)}</b><small>${esc(r.description||"")}${r.due_at?" · "+fmt(r.due_at):""}${r.event_date?" · "+fmt(r.event_date):""}</small></div><button class="iconbtn" title="Editar" data-edit="${k}" data-id="${r.id}">✎</button><button class="iconbtn" title="Excluir" data-delete="${k}" data-id="${r.id}">✕</button></div>`}
function rows(arr,s=false){return arr.length?arr.map(r=>row(r,s)).join(""):'<div class="empty">Nada cadastrado ainda.</div>'}
function robot(){return `<svg class="robot" viewBox="0 0 100 100" aria-label="Robôzinho"><rect x="16" y="8" width="68" height="62" rx="25" fill="#dbeaff"/><rect x="23" y="16" width="54" height="44" rx="18" fill="#071b30"/><path d="M35 40q7-10 14 0M55 40q7-10 14 0" fill="none" stroke="#64ddff" stroke-width="4" stroke-linecap="round"/><rect x="34" y="72" width="32" height="24" rx="10" fill="#c0d9ef"/><path d="m50 79 4 5-4 5-4-5z" fill="#369aff"/><circle cx="13" cy="39" r="8" fill="#369aff"/><circle cx="87" cy="39" r="8" fill="#369aff"/></svg>`}
function home(){let pending=privateRows("task").filter(r=>!r.completed),events=privateRows("event").filter(r=>!r.due_at||dOnly(r.due_at)>=today()).sort((a,b)=>(a.due_at||"").localeCompare(b.due_at||""));return `<div class="hero"><div><h2>Teu espaço de organização <span style="color:#56c7ff">✦</span></h2><div class="muted">O que importa, sem informações repetidas.</div></div>${robot()}</div><div class="stats">${[["Tarefas pendentes",pending.length],["Projetos",privateRows("project").length],["Compromissos",events.length],["Listas de compras",privateRows("shopping_list").length]].map(([a,b])=>`<div class="card stat"><small>${a}</small><strong>${b}</strong></div>`).join("")}</div><div class="cols">${card("Tarefas",rows(pending.slice(0,5)),buttonAdd("task"))}${card("Próximos compromissos",rows(events.slice(0,5)),buttonAdd("event"))}</div><div class="cols"><section class="card"><h3>Assistente do Segundo Cérebro ${robot()}</h3><div class="muted">Cria tarefas, listas e consulta pendências por texto. A voz depende do navegador.</div><div id="chat">${chat.slice(-6).map(c=>`<div class="chatline ${c.who}">${esc(c.text)}</div>`).join("")}</div><form id="ask-form" class="ask"><input id="ask-input" placeholder="Ex.: cria tarefa pagar luz amanhã" required><button type="button" id="mic">🎙</button><button class="primary">Enviar</button></form></section>${card("Planejamento a Dois",`<p class="muted">Espaço compartilhado com ${ALLOWED[user.id]==="Helena"?"Nat":"Helena"}.</p><button data-goto="couple">Abrir planejamento</button>`)}</div>`}
function listing(k){let r=privateRows(k);return `<div class="row" style="margin-bottom:15px"><h2>${privateKinds[k]}</h2>${buttonAdd(k)}</div>${k==="shopping_list"?`<div class="cols">${r.map(l=>card(esc(l.title),`${rows(records.filter(i=>i.kind==="shopping_item"&&i.parent_id===l.id))}<button data-add-item="${l.id}">+ Produto</button><button data-edit="shopping_list" data-id="${l.id}">Editar lista</button><button data-delete="shopping_list" data-id="${l.id}">Excluir lista</button>`)).join("")||card("Listas de compras",'<div class="empty">Crie sua primeira lista.</div>')}</div>`:card(privateKinds[k],rows(r))}`}
function areaView(){let a=area;return `<div class="cols">${card("Tarefas",rows(privateRows("task").slice(0,6)),buttonAdd("task"))}${card("Projetos",rows(privateRows("project").slice(0,6)),buttonAdd("project"))}${card("Agenda",rows(privateRows("event").slice(0,6)),buttonAdd("event"))}${card("Biblioteca",rows(privateRows("note").slice(0,6)),buttonAdd("note"))}</div>`}
function mapView(){return card("Mapa de Conexões",privateRows("project").length?privateRows("project").map(p=>`<div class="item"><div class="item-main"><b>${esc(p.title)}</b><small>${records.filter(t=>t.kind==="task"&&t.parent_id===p.id).length} tarefa(s) vinculada(s)</small></div></div>`).join(""):'<div class="empty">Crie projetos e vincule tarefas a eles.</div>')}
function couple(){
 let ts=[["meeting","Reuniões"],["agenda_item","Pauta"],["agreement","Combinados"],["goal","Metas"],["note","Notas"]];
 let meetings=sharedRows("meeting"), ata=shared.some(r=>r.metadata?.source==="ata_25_10_2026");
 let info=sharedIssue?`<div class="notice">${esc(sharedIssue)}</div>`:!ata?`<div class="notice">A ata de 25/10/2026 ainda não foi localizada entre os registros visíveis nesta conta. Usa Atualizar; se continuar ausente, precisamos conferir o acesso ao espaço no Supabase.</div>`:`<div class="notice" style="border-color:#2b766d;background:#12332f">Ata de 25/10/2026 encontrada no espaço compartilhado. ${shared.filter(r=>r.metadata?.source==="ata_25_10_2026").length} registros da importação visíveis.</div>`;
 let list=tab==="meeting"?meetings.map(r=>`<section class="card" style="margin-bottom:12px"><div class="row"><div><h3 style="margin:0">${esc(r.title)}</h3><small class="muted">${r.event_date?fmt(r.event_date):"Sem data"}</small></div><div class="actions"><button data-edit="shared:meeting" data-id="${r.id}">Editar</button><button class="iconbtn" data-delete="shared:meeting" data-id="${r.id}" title="Excluir">✕</button></div></div><details style="margin-top:12px" ${r.metadata?.source==="ata_25_10_2026"?"open":""}><summary style="cursor:pointer;color:#7cc9ff">Ver ata completa</summary><div class="ata-text">${esc(r.description||"Sem detalhes")}</div></details></section>`).join("")||'<div class="empty">Nenhuma reunião visível.</div>':card(sharedKinds[tab],rows(sharedRows(tab),true),buttonAdd("shared:"+tab));
 return `<div class="row" style="flex-wrap:wrap"><div class="muted">Espaço compartilhado entre Helena e Nat.</div><button id="refresh-shared">↻ Atualizar dados</button></div>${info}<div class="tabs">${ts.map(([k,n])=>`<button data-tab="${k}" class="${tab===k?"on":""}">${n} (${sharedRows(k).length})</button>`).join("")}</div>${tab==="meeting"?`<div class="row" style="margin-bottom:12px"><h2>Reuniões</h2>${buttonAdd("shared:meeting")}</div>`:""}${list}`;
}

function bind(){let refresh=$("#refresh-shared");if(refresh)refresh.onclick=async()=>{refresh.disabled=true;refresh.textContent="Atualizando…";await load();};document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>openForm(b.dataset.add));document.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>{page=b.dataset.goto;render()});document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll("[data-add-item]").forEach(b=>b.onclick=()=>openForm("shopping_item",null,b.dataset.addItem));document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{let k=b.dataset.edit,s=k.startsWith("shared:");openForm(k,(s?shared:records).find(x=>x.id===b.dataset.id))});document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>remove(b.dataset.delete,b.dataset.id));document.querySelectorAll("[data-toggle]").forEach(b=>b.onchange=()=>toggle(b.dataset.toggle,b.dataset.id,b.checked));let ask=$("#ask-form");if(ask)ask.onsubmit=e=>{e.preventDefault();runCommand($("#ask-input").value);$("#ask-input").value=""};let mic=$("#mic");if(mic)mic.onclick=()=>listen()}
const field=(name,label,type="text",value="",opts)=>`<div class="form-field"><label>${label}</label>${type==="textarea"?`<textarea name="${name}">${esc(value)}</textarea>`:type==="select"?`<select name="${name}">${opts.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(value)?"selected":""}>${esc(t)}</option>`).join("")}</select>`:`<input type="${type}" name="${name}" value="${esc(value)}" ${name==="title"?"required maxlength=160":""}>`}</div>`;
function openForm(k,r=null,parentId=null){editing={k,id:r?.id||null,parentId};let s=k.startsWith("shared:"),kind=s?k.split(":")[1]:k;$("#edit-title").textContent=(r?"Editar ":"Adicionar ")+(s?sharedKinds[kind]:privateKinds[kind]);let fields=field("title","Título","text",r?.title||"")+field("description",kind==="meeting"?"Ata / detalhes":"Observações","textarea",r?.description||"");if(!s)fields+=field("area","Ambiente","select",r?.metadata?.area||((area==="geral")?"pessoal":area),[["pessoal","Pessoal"],["profissional","Profissional"]]);if(["task","event","project","meeting","agreement","goal"].includes(kind))fields+=field("date","Data / prazo","date",dOnly(r?.due_at||r?.event_date));if(kind==="task")fields+=field("parent_id","Projeto","select",r?.parent_id||"",[["","Nenhum"],...records.filter(x=>x.kind==="project").map(x=>[x.id,x.title])]);$("#fields").innerHTML=fields;$("#edit-overlay").classList.add("show");$("#fields input")?.focus()}
function closeForm(){$("#edit-overlay").classList.remove("show");editing=null}
$("#close-edit").onclick=closeForm;$("#cancel-edit").onclick=closeForm;$("#edit-overlay").onclick=e=>{if(e.target.id==="edit-overlay")closeForm()};
$("#edit-form").onsubmit=async e=>{e.preventDefault();if(busy||!editing)return;busy=true;$("#save-btn").disabled=true;let {k,id,parentId}=editing,s=k.startsWith("shared:"),kind=s?k.split(":")[1]:k,fd=Object.fromEntries(new FormData(e.target).entries());let payload={kind,title:fd.title.trim(),description:fd.description||""};if(!payload.title){toast("Informe um título");busy=false;$("#save-btn").disabled=false;return}if(s){payload.event_date=fd.date||null;if(!id){payload.space_id=spaceId;payload.author_id=user.id}}else{payload.due_at=fd.date?new Date(fd.date+"T12:00:00").toISOString():null;payload.metadata={area:fd.area||"pessoal"};payload.parent_id=kind==="shopping_item"?parentId:(kind==="task"?(fd.parent_id||null):null);if(!id)payload.owner_id=user.id}try{if(s&&!spaceId)throw Error("Planejamento a Dois ainda não está vinculado a esta conta.");let table=s?"shared_records":"private_records",q=id?client.from(table).update(payload).eq("id",id):client.from(table).insert(payload);let {error}=await q;if(error)throw error;closeForm();await load();toast("Salvo com sucesso!") }catch(err){toast("Não foi possível salvar: "+errorMsg(err))}finally{busy=false;$("#save-btn").disabled=false}};
async function remove(k,id){if(!confirm("Excluir este registro?"))return;let s=k.startsWith("shared:");let {error}=await client.from(s?"shared_records":"private_records").delete().eq("id",id);if(error)toast(errorMsg(error));else{await load();toast("Registro excluído")}}
async function toggle(k,id,completed){let s=k.startsWith("shared:");let {error}=await client.from(s?"shared_records":"private_records").update({completed}).eq("id",id);if(error)toast(errorMsg(error));else await load()}
function addChat(who,text){chat.push({who,text});if(page!=="home")page="home";render()}
function localDate(term){let d=new Date();if(/amanh[ãa]/i.test(term))d.setDate(d.getDate()+1);else if(/hoje/i.test(term)){}else return null;return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
async function runCommand(text){let t=text.trim(),low=t.toLowerCase();addChat("you",t);try{let m;if((m=low.match(/(?:cria|criar|adiciona|adicionar|anota|anotar)\s+(?:uma?\s+)?tarefa\s+(?:para\s+|de\s+)?(.+)/i))){let title=t.slice(t.length-m[1].length).replace(/\s+(amanh[ãa]|hoje)$/i,"").trim(),dt=localDate(t);let {error}=await client.from("private_records").insert({owner_id:user.id,kind:"task",title,description:"",due_at:dt?new Date(dt+"T12:00:00").toISOString():null,metadata:{area:area==="profissional"?"profissional":"pessoal"}});if(error)throw error;await load();addChat("bot","Tarefa criada: "+title+(dt?" — "+fmt(dt):""));return}
if((m=low.match(/(?:cria|criar|faz|fazer)\s+(?:uma?\s+)?lista\s+(?:de\s+)?(?:compras)?\s*(.*)/i))){let title=m[1]?.trim()||"Lista de compras";let {error}=await client.from("private_records").insert({owner_id:user.id,kind:"shopping_list",title,metadata:{area:"pessoal"}});if(error)throw error;await load();addChat("bot","Lista criada: "+title);return}
if((m=low.match(/(?:adiciona|adicionar|coloca|colocar)\s+(.+?)\s+(?:na|à)\s+lista/i))){let l=records.find(x=>x.kind==="shopping_list");if(!l){addChat("bot","Cria primeiro uma lista de compras.");return}let items=m[1].split(/,|\s+e\s+/i).map(x=>x.trim()).filter(Boolean);let {error}=await client.from("private_records").insert(items.map(title=>({owner_id:user.id,kind:"shopping_item",title,parent_id:l.id,metadata:{area:"pessoal"}})));if(error)throw error;await load();addChat("bot",items.length+" produto(s) adicionado(s) à lista "+l.title);return}
if(/(?:quais|mostra|mostrar|tenho|pendentes|fazer).*(?:tarefas|fazer)|(?:tarefas).*(?:hoje|amanh[ãa]|semana)/i.test(low)){let r=records.filter(x=>x.kind==="task"&&!x.completed);if(/hoje/.test(low))r=r.filter(x=>dOnly(x.due_at)===today());if(/amanh[ãa]/.test(low)){let d=new Date();d.setDate(d.getDate()+1);let tomorrow=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;r=r.filter(x=>dOnly(x.due_at)===tomorrow)}addChat("bot",r.length?r.slice(0,12).map(x=>"• "+x.title+(x.due_at?" ("+fmt(x.due_at)+")":"")).join("\n"):"Nenhuma tarefa pendente nesse período.");return}
if(/(?:falta comprar|lista de compras|o que comprar)/i.test(low)){let l=records.find(x=>x.kind==="shopping_list");let r=l?records.filter(x=>x.kind==="shopping_item"&&x.parent_id===l.id&&!x.completed):[];addChat("bot",r.length?r.map(x=>"• "+x.title).join("\n"):"Nenhum item pendente na lista.");return}
if(/(?:compromissos|agenda|marcado)/i.test(low)){let r=records.filter(x=>x.kind==="event").sort((a,b)=>(a.due_at||"").localeCompare(b.due_at||""));addChat("bot",r.length?r.slice(0,10).map(x=>"• "+x.title+(x.due_at?" ("+fmt(x.due_at)+")":"")).join("\n"):"Nenhum compromisso cadastrado.");return}
addChat("bot","Posso criar tarefas e listas de compras, adicionar produtos e consultar tarefas, compras e agenda. Ex.: 'cria tarefa pagar internet amanhã'.")}catch(err){addChat("bot","Erro: "+errorMsg(err))}}
function listen(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){toast("Este navegador não oferece reconhecimento de voz. Usa o campo de texto.");return}let rec=new R();rec.lang="pt-BR";rec.onresult=e=>{let t=e.results[0][0].transcript;$("#ask-input").value=t;runCommand(t)};rec.onerror=e=>toast("Microfone: "+e.error+". Verifica as permissões e usa HTTPS.");try{rec.start()}catch(e){toast(errorMsg(e))}}
init();
</script><script>if("serviceWorker" in navigator && location.protocol === "https:"){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}</script></body></html>
